[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-search-ui"
version = "0.1.0"
description = "System 3: Agentic search agent with FastAPI backend, LangGraph orchestration, and React UI for querying the NCBI knowledge graph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "anthropic>=0.34",
    "litellm>=1.40",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "PyJWT>=2.13",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "mcp>=2.0",
    # F-4.1-J-04 (judge round 1, build phase 4.1): declared explicitly,
    # see requirements.txt for the full rationale.
    "mcp-types>=2.0",
    "httpx2>=2.0",
    # T-4.3-06, build phase 4.3: exact pin, not a floor, per
    # tracker/phase_4.3.md's supply-chain review (no compromise report, MIT
    # licensed, no install-time execution surface in the wheel) and this
    # repo's own `strawberry-graphql==0.324.0` published-docs-mismatch
    # finding: the published docs available to that review were forty-odd
    # releases behind, so every API name the GraphQL surface depends on was
    # probed directly against this exact installed version rather than
    # trusted from documentation. `cross-web>=0.6.0` arrives as a required
    # (non-extra) transitive dependency; see requirements.txt for the full
    # note, not restated here.
    "strawberry-graphql==0.324.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
s3 = "system_03_search_agent.adapters.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests that hit the network or require external services",
]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = [
    "system_03_search_agent",
    "system_03_search_agent.adapters",
    "system_03_search_agent.adapters.cli",
    "system_03_search_agent.adapters.graphql",
    "system_03_search_agent.adapters.mcp",
    "system_03_search_agent.adapters.web_sse",
    "system_03_search_agent.auth",
    "system_03_search_agent.contracts",
    "system_03_search_agent.core",
    "system_03_search_agent.data",
    "system_03_search_agent.guardrail",
    "system_03_search_agent.harness",
    "system_03_search_agent.synthesis",
    "system_03_search_agent.tools",
]
