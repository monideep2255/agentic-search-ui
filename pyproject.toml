[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-search-ui"
version = "0.1.0"
description = "System 3: Agentic search agent with FastAPI backend, LangGraph orchestration, and React UI for querying the NCBI knowledge graph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "anthropic>=0.34",
    "litellm>=1.40",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "PyJWT>=2.13",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "mcp>=2.0",
    # F-4.1-J-04 (judge round 1, build phase 4.1): declared explicitly,
    # see requirements.txt for the full rationale.
    "mcp-types>=2.0",
    "httpx2>=2.0",
    # T-4.3-06, build phase 4.3: exact pin, not a floor, per
    # tracker/phase_4.3.md's supply-chain review (no compromise report, MIT
    # licensed, no install-time execution surface in the wheel) and this
    # repo's own `strawberry-graphql==0.324.0` published-docs-mismatch
    # finding: the published docs available to that review were forty-odd
    # releases behind, so every API name the GraphQL surface depends on was
    # probed directly against this exact installed version rather than
    # trusted from documentation. `cross-web>=0.6.0` arrives as a required
    # (non-extra) transitive dependency; see requirements.txt for the full
    # note, not restated here.
    "strawberry-graphql==0.324.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Build phase 4.14: the three tools Section 24's gates 2, 3 and 6 name.
    # Ruff is an EXACT pin, not a floor, and deliberately so: this repository
    # sets no explicit `select`, so the enabled rule set is whatever the
    # installed ruff version defaults to. A floor would let a minor bump change
    # what gate 3 enforces without anyone editing a line of configuration, and
    # CI would start failing (or stop catching things) on a schedule nobody
    # chose. Bump it on purpose, and re-run `ruff check` when you do.
    "ruff==0.16.0",
    "isort>=5.13",
    "pip-audit>=2.7",
]

[project.scripts]
s3 = "system_03_search_agent.adapters.cli.main:main"
s3-kgx-export = "system_03_search_agent.export.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." is here for `services/`, the separately deployed graph query service
# added at build phase 4.11. It is not part of the agent distribution: it runs
# on the Hetzner box, imports three modules out of this package, and is copied
# there by its own deploy script, so it is deliberately not in the setuptools
# packages list below.
pythonpath = ["src", "."]
markers = [
    "integration: marks tests that hit the network or require external services",
]

[tool.ruff]
line-length = 100

# Import order has ONE owner, and it is Section 24's gate 2, `isort --check`.
#
# Ruff ships its own reimplementation of isort as the `I` rules, and this
# repository's rule set enables them, so before build phase 4.14 both tools had
# an opinion about import order. They do not hold the same opinion. Measured on
# 2026-08-26 over this tree: with ruff green, `isort --check` failed on 26
# files; after running isort, `ruff check` failed on 23. Each tool's fix
# re-breaks the other, so one of the two gates is always red no matter what
# anyone commits.
#
# The largest single cause is `alembic`, and it shows which tool to believe.
# Ruff sees a directory named `alembic/` at the repository root and classifies
# `from alembic import op` as a FIRST-PARTY import. It is not: it is the
# installed third-party migration library, and `alembic/` is the migrations
# directory, not an importable package of ours. isort classifies it correctly.
#
# So `I` is turned off here and `[tool.isort]` below owns the property. This
# does not leave import order unchecked, which would be weakening a gate. It
# moves the check to the tool Section 24 names for it, and to the tool that is
# right about this repository's layout.
[tool.ruff.lint]
ignore = ["I001"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["system_03_search_agent"]
src_paths = ["src", "tests", "services"]
# Ruff's isort implementation splits on a trailing comma and treats a
# parenthesised single import as multi-line; these two keep isort from
# reformatting what ruff considers already correct.
force_sort_within_sections = false
# `profile = "black"` turns this ON; ruff's isort leaves it OFF. Left as
# black sets it, isort merges an aliased import back into the main `from`
# block and ruff accepts the split form, so each tool's fix re-breaks the
# other. Explicitly matched to ruff rather than to the profile.
combine_as_imports = false
skip_gitignore = true

[tool.setuptools]
packages = [
    "system_03_search_agent",
    "system_03_search_agent.adapters",
    "system_03_search_agent.adapters.cli",
    "system_03_search_agent.adapters.graphql",
    "system_03_search_agent.adapters.mcp",
    "system_03_search_agent.adapters.web_sse",
    "system_03_search_agent.auth",
    "system_03_search_agent.contracts",
    "system_03_search_agent.core",
    "system_03_search_agent.data",
    # Added at build phase 4.6 (F-4.6-02). This list is hand-maintained, so a
    # new package is invisible to an installed distribution until someone
    # remembers to add it here, while `pythonpath = ["src"]` keeps the test
    # suite green either way. `export` was missing since build phase 4.4 and
    # was found by that same gap, not by a test.
    "system_03_search_agent.export",
    "system_03_search_agent.feedback",
    "system_03_search_agent.guardrail",
    "system_03_search_agent.harness",
    "system_03_search_agent.orchestrator",
    "system_03_search_agent.synthesis",
    "system_03_search_agent.tools",
]
